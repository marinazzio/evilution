name: Benchmark

on:
  push: {}
  workflow_dispatch: {}

jobs:
  memory_check:
    runs-on: ubuntu-24.04
    name: Memory leak check

    strategy:
      matrix:
        ruby:
          - '3.4.10'
          - '4.0.7'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run memory check
        run: bundle exec rake memory:check
        timeout-minutes: 5
        env:
          MEMORY_CHECK_ITERATIONS: '50'
          MEMORY_CHECK_MAX_GROWTH_KB: '10240'
          MEMORY_CHECK_SEED: ${{ github.run_number }}
