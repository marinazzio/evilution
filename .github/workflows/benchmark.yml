name: Benchmark

on:
  push: {}

jobs:
  memory_check:
    runs-on: ubuntu-24.04
    name: Memory leak check

    strategy:
      matrix:
        ruby:
          - '3.4.10'
          - '4.0.6'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run memory check
        run: bundle exec rake memory:check
        timeout-minutes: 5
        env:
          MEMORY_CHECK_ITERATIONS: '50'
          MEMORY_CHECK_MAX_GROWTH_KB: '10240'
