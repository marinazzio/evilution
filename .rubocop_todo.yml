# This file lists per-file metric exclusions that should eventually be paid down
# (refactor the file rather than expanding the exclude list). Inherited from .rubocop.yml.

Metrics/AbcSize:
  Exclude:
    - "lib/evilution/runner.rb"
    - "lib/evilution/isolation/fork.rb"
    - "scripts/combined_runs_spike/combined.rb"
    - "scripts/schemata_spike/**/*"

Metrics/ClassLength:
  Exclude:
    - "lib/evilution/config.rb"
    - "lib/evilution/isolation/fork.rb"
    - "lib/evilution/integration/minitest.rb"
    - "lib/evilution/mcp/mutate_tool.rb"
    - "lib/evilution/runner.rb"
    - "lib/evilution/runner/isolation_resolver.rb"
    - "lib/evilution/cli/parser/options_builder.rb"
    - "lib/evilution/spec_resolver.rb"
    - "lib/evilution/mutator/registry.rb"
    - "scripts/schemata_spike/**/*"

Metrics/MethodLength:
  Exclude:
    - "lib/evilution/runner.rb"
    - "scripts/combined_runs_spike/combined.rb"
    - "scripts/schemata_spike/**/*"

# The empty forward declaration (`class Evilution::CLI; end`) that lets the
# children nest under the namespace before the full definition counts as a
# second top-level class. See "Require conventions" in docs/architecture.md.
Style/OneClassPerFile:
  Exclude:
    - "lib/evilution/cli.rb"
    - "lib/evilution/integration/rspec/state_guard.rb"

Metrics/ParameterLists:
  Exclude:
    - "lib/evilution/result/summary.rb"
    - "lib/evilution/result/mutation_result.rb"
    - "lib/evilution/runner/mutation_executor/strategy/parallel.rb"

# The mutant schemata spike harness is kept as it was measured (style fixes
# only), so the committed code is the code behind the numbers in
# docs/mutant_schemata_spike.md. It is measurement-only (never loaded by the
# gem); splitting its methods to meet the metric limits would make it differ
# from what was run.
Metrics/ModuleLength:
  Exclude:
    - "scripts/schemata_spike/**/*"

# The combined-runs spike harness is likewise a measurement harness kept as it
# ran for docs/combined_runs_spike.md, not gem code: refactoring it would
# change the code the report measured, so its metric offenses are accepted
# rather than paid down (with the AbcSize and MethodLength entries above).
Metrics/CyclomaticComplexity:
  Exclude:
    - "scripts/combined_runs_spike/combined.rb"
    - "scripts/schemata_spike/**/*"

Metrics/PerceivedComplexity:
  Exclude:
    - "scripts/combined_runs_spike/combined.rb"
    - "scripts/schemata_spike/**/*"
