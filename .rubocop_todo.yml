# This file lists per-file metric exclusions that should eventually be paid down
# (refactor the file rather than expanding the exclude list). Inherited from .rubocop.yml.

Metrics/AbcSize:
  Exclude:
    - "lib/evilution/runner.rb"
    - "lib/evilution/isolation/fork.rb"

Metrics/ClassLength:
  Exclude:
    - "lib/evilution/config.rb"
    - "lib/evilution/isolation/fork.rb"
    - "lib/evilution/integration/minitest.rb"
    - "lib/evilution/mcp/mutate_tool.rb"
    - "lib/evilution/runner.rb"
    - "lib/evilution/runner/isolation_resolver.rb"
    - "lib/evilution/cli/parser/options_builder.rb"
    - "lib/evilution/spec_resolver.rb"
    - "lib/evilution/mutator/registry.rb"

Metrics/MethodLength:
  Exclude:
    - "lib/evilution/runner.rb"

# The empty forward declaration (`class Evilution::CLI; end`) that lets the
# children nest under the namespace before the full definition counts as a
# second top-level class. See "Require conventions" in docs/architecture.md.
Style/OneClassPerFile:
  Exclude:
    - "lib/evilution/cli.rb"
    - "lib/evilution/integration/rspec/state_guard.rb"
